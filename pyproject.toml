[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricspi"
version = "1.0.0.dev0"
description = "Offline-Songtext-Prompter für Live-Auftritte"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.1.2,<3; sys_platform == 'linux'",
    "pygame>=2.6.1,<3; sys_platform != 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
